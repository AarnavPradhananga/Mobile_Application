<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Box</title>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body{
      margin:0;
      height:100vh;
      background:#111;
      overflow:hidden;
      position:relative;
    }

    .box{
      width:100px;
      height:100px;
      background:red;
      position:absolute;
      top:0;
      left:0;
      border-radius:15px;
    }
  </style>
</head>
<body>

  <div class="box"></div>

  <script src="script.js"></script>
</body>
</html>
