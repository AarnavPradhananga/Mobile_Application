<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callback Animation</title>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .container{
      width: 500px;
      height: 500px;
      border: 3px solid white;
      position: relative;
    }

    .box{
      width: 80px;
      height: 80px;
      background: red;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 10px;
    }

  </style>

</head>
<body>

  <div class="container">
    <div class="box"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>
